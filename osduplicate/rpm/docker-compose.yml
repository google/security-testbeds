x-common: &common
  volumes:
    - /tmp/scalibr:/usr/bin/scalibr
  command: ["/bin/sh", "-c", "/usr/bin/verify.sh || sleep infinity"]
  env_file:
    - common.env

services:
  rhel:
    <<: *common
    image: osduplicate-rpm-rhel
    build:
      context: ..
      dockerfile_inline: |
        FROM registry.access.redhat.com/ubi9/ubi:latest
        RUN dnf install -y runc
        RUN dnf install -y 'dnf-command(config-manager)' && \
            dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
            dnf install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh

  centos:
    <<: *common
    image: osduplicate-rpm-centos
    build:
      context: ..
      dockerfile_inline: |
        FROM quay.io/centos/centos:stream9
        RUN dnf install -y runc
        RUN dnf install -y 'dnf-command(config-manager)' && \
            dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
            dnf install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh

  almalinux:
    <<: *common
    image: osduplicate-rpm-almalinux
    build:
      context: ..
      dockerfile_inline: |
        FROM almalinux:9
        RUN dnf install -y runc
        RUN dnf install -y 'dnf-command(config-manager)' && \
            dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
            dnf install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh

  rockylinux:
    <<: *common
    image: osduplicate-rpm-rockylinux
    build:
      context: ..
      dockerfile_inline: |
        FROM rockylinux:9
        RUN dnf install -y runc
        RUN dnf install -y 'dnf-command(config-manager)' && \
            dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
            dnf install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh

  sles:
    <<: *common
    image: osduplicate-rpm-sles
    build:
      context: ..
      dockerfile_inline: |
        FROM registry.suse.com/bci/bci-base:15.6
        RUN zypper install -y runc awk
        RUN zypper addrepo https://cli.github.com/packages/rpm/gh-cli.repo && \
            zypper --gpg-auto-import-keys refresh && \
            zypper install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh
    environment:
      - DEFAULT_PKG_FILE=usr/sbin/runc

  opensuse:
    <<: *common
    image: osduplicate-rpm-opensuse
    build:
      context: ..
      dockerfile_inline: |
        FROM opensuse/leap:15.6
        RUN zypper install -y runc
        RUN zypper addrepo https://cli.github.com/packages/rpm/gh-cli.repo && \
            zypper --gpg-auto-import-keys refresh && \
            zypper install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh
    environment:
      - DEFAULT_PKG_FILE=usr/sbin/runc

  amazonlinux2:
    <<: *common
    image: osduplicate-rpm-amazonlinux2
    build:
      context: ..
      dockerfile_inline: |
        FROM amazonlinux:2
        RUN yum install -y tomcat
        RUN amazon-linux-extras enable docker && \
            yum install -y runc
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh
    environment:
      - DEFAULT_PKG=tomcat
      - DEFAULT_PKG_FILE=usr/share/java/avalon-framework-api.jar
      - EXTRA_PKG=runc
      - EXTRA_PKG_FILE=usr/sbin/runc
      - LANGUAGE_EXTRACTORS=go/binary,java/archive

  amazonlinux2023:
    <<: *common
    image: osduplicate-rpm-amazonlinux2023
    build:
      context: ..
      dockerfile_inline: |
        FROM amazonlinux:2023
        RUN dnf install -y runc
        RUN dnf install -y 'dnf-command(config-manager)' && \
            dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
            dnf install -y gh
        COPY verify.sh /usr/bin/verify.sh
        RUN chmod +x /usr/bin/verify.sh
    environment:
      - DEFAULT_PKG_FILE=usr/sbin/runc
