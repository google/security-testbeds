version: "3.8"

services:
  jenkins-vuln:
    build: .
    container_name: jenkins-vuln
    ports:
      - "8081:8080"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  jenkins-safe:
    image: jenkins/jenkins:2.562
    container_name: jenkins-safe
    ports:
      - "8082:8080"
